name = "shouldaheld-api"
main = "worker.js"
compatibility_date = "2026-10-01"
routes = [
  { pattern = "api.shouldaheld.com", custom_domain = true },
  { pattern = "r.shouldaheld.com", custom_domain = true },
  { pattern = "admin.shouldaheld.com", custom_domain = true },
]

# Cloudflare Access app guarding admin.shouldaheld.com. Not secrets: the team domain and the app's AUD tag.
# Empty values keep the admin closed.
[vars]
ACCESS_TEAM = "mute-union-6f3f.cloudflareaccess.com"
ACCESS_AUD = "6f518bd8d8bde103168f9a09c47a469c743362021698538c09c0b6b7e1ac9976"

[[d1_databases]]
binding = "DB"
database_name = "shouldaheld"
database_id = "58d2f01f-6ca2-4891-9fac-c6bfacc11b7a"
